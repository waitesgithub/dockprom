version: '2.1'

services:
  ollama-gateway:
    image: envoyproxy/envoy:v1.30.4
    container_name: ollama-gateway
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yml", "--log-level", "info"]
    volumes:
      - ./envoy:/etc/envoy:ro
    extra_hosts:
      # Requires Docker 20.10+ (Linux): resolves to the host gateway IP
      - "host.docker.internal:host-gateway"
    ports:
      # Users/apps can call the gateway on the host at :11435
      - "11435:11434"
    expose:
      # Prometheus scrape endpoint (Envoy admin)
      - 9901
    restart: unless-stopped
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"

networks:
  monitor-net:
    external: true
